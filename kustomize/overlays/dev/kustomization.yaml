apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: class-2

resources:
- ../../base
- configmap.yaml
- ingress.yaml

patches:
- path: patch-deployment.yaml
  target:
    kind: Deployment
    name: sk999-myfirst-api-server

# 이미지 tag만 갱신하고 싶을 때 (standalone kustomize CLI 필요):
#   cd kustomize/dev && kustomize edit set image \
#     skala-registry.skala-us.com/class-2/sk999-webserver=skala-registry.skala-us.com/class-2/sk999-webserver:<NEW_TAG>
images:
- name: skala-registry.skala-us.com/class-2/sk999-webserver
  newName: skala-registry.skala-us.com/class-2/sk999-webserver
  newTag: 1.0-bd4-4e367e9
